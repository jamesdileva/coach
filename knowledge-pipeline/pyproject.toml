[project]
name = "coach-knowledge-pipeline"
version = "0.1.0"
description = "Project Coach AI Knowledge Pipeline: OSRS Wiki -> encounter pack JSON"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
